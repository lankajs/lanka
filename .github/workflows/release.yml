name: release

# ONLY CI publishes, and only on a tag.
#
# Not from a machine: the npm token lives in repository secrets rather than in
# somebody's `~/.npmrc`, and what is published always matches what the tag holds.
# The undo window is 72 hours and exists once, so this runs everything the
# ordinary check runs plus a dry run before the real publish.
on:
    push:
        tags: ["v*"]

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - run: pnpm install --frozen-lockfile

            # The same gates as on every push: a tag is no reason to skip them.
            - run: pnpm run check:drift
            - run: pnpm run check

            # Printed into the release log, not judged: this runner is not the
            # instrument the baselines were recorded on. Whoever cut the tag held
            # the ratchet with `pnpm run check:perf` on an idle machine — step 4 of
            # "Before the FIRST publish" in CONTRIBUTING.md.
            - run: pnpm run check:perf:report

            # Fitness to publish, separate from the build: name, version, licence,
            # repository URL, `private` removed.
            - run: pnpm run check:publishable

            # A dry run BEFORE the real one: it shows exactly what would ship while
            # cancelling is still free. Same flags as the real publish but for
            # `--provenance`, which needs a real publish to sign: a rehearsal that
            # differs from the performance can pass and let the performance fail.
            - run: pnpm -r publish --dry-run --access public --no-git-checks

            # `--provenance` is what `id-token: write` above is FOR: npm signs an
            # attestation tying each tarball to this workflow, this commit and this
            # repository, and shows it on the package page. The permission was
            # requested here before the flag was passed — a promise nothing kept,
            # and invisible, because a publish without it succeeds quietly.
            - run: pnpm -r publish --access public --provenance --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
