name: check

# The single merge arbiter. A local green equals a remote green only while both
# sides run ONE command, so this workflow calls `pnpm check` rather than an
# expanded step list that would drift from the list in `.specwarden/checks/`.
on:
    push:
        branches: ["**"]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6

            # The floor `engines` declares, so a green here means the oldest
            # supported runtime works. It was 20 until Node 20 left support
            # (2026-04-30); by then the workspace ran on 22's global WebSocket, and
            # Vitest 5 and Angular 22 declare 22 themselves — a floor below what the
            # tools accept is not one. specwarden runs from 18.18, so the list and
            # the floor are proved by the same run.
            #
            # The EXACT version, not `22`: a range resolves to the newest 22.x, and
            # a green there says nothing about 22.12.0. That is not a theory — the
            # relay playground failed on 22.12.0 through a Node `BroadcastChannel`
            # defect later 22.x releases fixed, and CI never saw it. Move this with
            # `engines`, never apart from it.
            - uses: actions/setup-node@v7
              with:
                  node-version: 22.12.0
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            # The whole list, `drift` included. It used to run as its own step
            # first, so a registry that diverged could not leave later gates
            # verifying something other than what ships; the list reports every
            # check and fails on any, so a red `drift` can no longer hide behind
            # a later green. Under GitHub Actions each finding is an annotation.
            - run: pnpm run check

            # Measured, never judged here. Every other gate reads files and gives
            # the same answer on any machine; a benchmark needs an instrument, and
            # a two-core shared runner is not one — the first run of this workflow
            # reported three unrelated operations at ~2× with none of that code
            # touched, and a busy laptop reported twenty across eight packages,
            # controls included. The numbers stay in the log for a reader; the
            # ratchet is held by `pnpm run check:perf` on an idle machine.
            - run: pnpm run check:perf:report
