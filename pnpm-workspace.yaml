# Four buckets, four kinds of package. The globs list them explicitly instead of
# taking `packages/**`: the kind of a package must be visible in its path, and a
# directory outside the four is not a package by any definition.
#
# A bucket may hold one more level: a FAMILY, several packages of one kind that
# bind the same port. Families are declared in scripts/registry.mjs and listed
# here one glob each, never as `modules/*/*` — an unnamed second level would make
# any nested directory a package again, which is the guard below.
#
# Single `*` rather than `**` is also a guard: a recursive glob picks up a
# `package.json` sitting in build output and makes the artefact a workspace
# member.
packages:
  - "core"
  - "modules/*"
  # A family: several packages of one kind binding one port. Declared in
  # scripts/registry.mjs, which is what every gate reads; this glob is the same
  # fact in the form pnpm understands.
  - "modules/validators/*"
  - "modules/query/*"
  - "modules/storage-adapters/*"
  - "modules/bindings/*"
  - "plugins/*"
  - "tools/*"
  # The applications, which are not packages: nothing here is published, nothing
  # is in `scripts/registry.mjs`, and every manifest is `private`. They are
  # globbed because they have dependencies — on the framework, and on each other
  # — and a workspace member is how one package resolves another from source.
  - "_playgrounds/*"
  # An ECOSYSTEM: the applications of one UI framework, plus the shared code only
  # they can use. Listed one glob each for the same reason the families above are
  # — a directory becomes a workspace member by being named, never by being
  # nested. `astro`, `vanilla` and `node` stay above: none of them belongs to a
  # single framework.
  - "_playgrounds/react/*"
  - "_playgrounds/vue/*"
onlyBuiltDependencies:
  - esbuild
